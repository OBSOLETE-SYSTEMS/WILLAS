<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Willa's Social Content Engine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<style>
  :root{
    /* Surface tokens — referenced via var() everywhere so theme swap works */
    --bg:#FAF6EC;        /* warm oat cream (was cool #FAFAF7) */
    --bg-card:#FFFDF6;   /* warm white card */
    --bg-warm:#FFFCF2;
    --bg-soft:#F3ECDD;   /* warm soft */
    --ink:#202A44;       /* brand navy — kept as the structural anchor */
    --ink-soft:#574E40;  /* warm espresso-taupe (was cool slate #475569) */
    --muted:#7A6F5E;     /* warm stone (was cool slate #64748B) */
    --border:#D9D0BD;    /* warm border */
    --border-soft:#EAE2D0;
    /* Brand accents (stay constant across themes) */
    --blue:#73B2C9; --green:#75C596; --red:#DC2626; --amber:#9E652E; --purple:#A191B2; --gold:#FACC15;
    /* Text scale — driven by Settings tab */
    --text-base:14px;
  }
  /* Dark theme — surfaces flip, brand accents preserved.
     Activated via [data-theme="dark"] on <html> from the Settings tab. */
  html[data-theme="dark"]{
    --bg:#10141B;
    --bg-card:#1A1F2A;
    --bg-warm:#1A1F2A;
    --bg-soft:#212835;
    --ink:#E8EDF2;
    --ink-soft:#B8C4D2;
    --muted:#8B95A5;
    --border:#2D3340;
    --border-soft:#1F2530;
  }
  /* Tailwind utility overrides for dark mode — many components use bg-white / text-[#202A44]
     directly; these selectors swap them without rewriting every component. */
  html[data-theme="dark"] .bg-white{background:var(--bg-card)!important;}
  html[data-theme="dark"] .bg-\[\#FFFEF7\],
  html[data-theme="dark"] .bg-\[\#FAFAF7\],
  html[data-theme="dark"] .bg-\[\#F6F6F0\]{background:var(--bg-warm)!important;}
  html[data-theme="dark"] .text-\[\#202A44\]{color:var(--ink)!important;}
  html[data-theme="dark"] .text-\[\#475569\]{color:var(--ink-soft)!important;}
  html[data-theme="dark"] .text-\[\#64748B\]{color:var(--muted)!important;}
  html[data-theme="dark"] .border-\[\#E8E2D3\]{border-color:var(--border-soft)!important;}
  /* ─── Willa's warm palette (2026-05-31) ─────────────────────────────
     Components hardcode cool slate greys (Tailwind arbitrary values) that
     made the engine read like a generic SaaS dashboard. Remap them to warm
     oat/taupe tones so the whole surface feels like Willa's — warm, heritage,
     kitchen-table — without editing every component. Light mode only; the
     dark-theme overrides above keep their own values via higher specificity. */
  html:not([data-theme="dark"]) .text-\[\#475569\]{color:#574E40 !important;}
  html:not([data-theme="dark"]) .text-\[\#334155\]{color:#433C2E !important;}
  html:not([data-theme="dark"]) .text-\[\#64748B\]{color:#7A6F5E !important;}
  html:not([data-theme="dark"]) .text-\[\#94A3B8\]{color:#9A8E7B !important;}
  html:not([data-theme="dark"]) .text-\[\#3F4A5E\]{color:#524938 !important;}
  html:not([data-theme="dark"]) .bg-\[\#F1F5F9\]{background:#F2ECDF !important;}
  html:not([data-theme="dark"]) .border-\[\#E2E8F0\]{border-color:#E6DECC !important;}
  html:not([data-theme="dark"]) .text-\[\#475569\] strong,
  html:not([data-theme="dark"]) .text-\[\#334155\] strong{color:inherit;}
  /* Text size scale — multiplies the base font-size on body */
  html[data-text-size="sm"] body{font-size:13px;}
  html[data-text-size="lg"] body{font-size:15.5px;}
  /* Reduce motion — respects user preference; turn off animations + transitions */
  html[data-motion="reduce"] *,
  html[data-motion="reduce"] *::before,
  html[data-motion="reduce"] *::after{
    animation-duration:0.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:0.001ms!important;
    scroll-behavior:auto!important;
  }
  html,body{background:var(--bg); color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; font-size:var(--text-base);}
  .font-serif{font-family:'Fraunces',Georgia,serif; font-optical-sizing:auto;}
  .font-mono{font-family:'DM Mono',ui-monospace,monospace;}
  .card{background:var(--bg-card); border:1px solid var(--border); border-radius:10px;}
  .pulse-dot{position:relative; display:inline-block; width:8px; height:8px; border-radius:999px; background:var(--red);}
  .pulse-dot::after{content:''; position:absolute; inset:-3px; border-radius:999px; border:1.5px solid var(--red); opacity:.6; animation:pulse 1.6s ease-out infinite;}
  .pulse-dot-green{background:#22C55E !important;}
  .pulse-dot-green::after{border-color:#22C55E !important;}
  @keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.7);opacity:0}}
  .ticker-track{display:flex; gap:40px; white-space:nowrap; animation:ticker 8s linear infinite; will-change:transform;}
  @keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  .fade-in{animation:fade .22s ease-out;}
  @keyframes fade{from{opacity:0; transform:translateY(3px)}to{opacity:1; transform:none}}
  .scrollbar::-webkit-scrollbar{width:7px;height:7px}
  .scrollbar::-webkit-scrollbar-thumb{background:#C8C2B4;border-radius:8px}
  .nav-item{transition:all .12s ease;}
  .nav-item:hover{background:#DCD6C8}
  .nav-item.active{background:#202A44; color:#fff;}
  html[data-theme="dark"] .nav-item:hover{background:var(--bg-soft);}
  html[data-theme="dark"] .nav-item.active{background:var(--ink); color:var(--bg);}
  .tab-btn{transition:all .12s ease; border-bottom:2px solid transparent;}
  .tab-btn.active{border-color:#202A44; color:#202A44;}
  .tab-btn:not(.active){color:#64748B;}
  .tab-btn:hover:not(.active){color:#202A44;}
  .src-link{color:var(--blue); text-decoration:none;}
  .src-link:hover{text-decoration:underline;}
  /* Sidebar "This Week's Highlights" — warm ambient glow so the button reads as
     the freshest thing on the page without shouting. Subtle amber ring + light
     shadow. Slightly stronger on hover. */
  .highlights-glow{box-shadow:0 0 0 2px rgba(253,230,138,0.55), 0 4px 14px rgba(250,204,21,0.18);}
  .highlights-glow:hover{box-shadow:0 0 0 2px rgba(250,204,21,0.7), 0 6px 18px rgba(250,204,21,0.28);}
  .highlights-pulse{position:relative; display:inline-block; width:6px; height:6px; border-radius:999px; background:#FACC15;}
  .highlights-pulse::after{content:''; position:absolute; inset:-3px; border-radius:999px; border:1.5px solid #FACC15; opacity:.6; animation:pulse 1.8s ease-out infinite;}
  /* Studio Riff Room title — highlighter marker behind big serif text. The
     Studio is the fun room of the engine; this is where the brand lets its
     hair down a bit. */
  .riff-title{
    font-family:'Fraunces',Georgia,serif;
    font-size:60px;
    line-height:1;
    letter-spacing:-0.02em;
    font-weight:600;
    font-style:italic;
    display:inline-block;
    padding:0 10px;
    color:#202A44;
    background:linear-gradient(180deg,transparent 58%,#FACC15 58%,#FACC15 88%,transparent 88%);
    transform:rotate(-0.8deg);
    position:relative;
  }
  .riff-title::after{
    content:'✦';
    position:absolute;
    top:-6px;
    right:-26px;
    font-size:22px;
    color:#FACC15;
    text-shadow:0 0 10px rgba(250,204,21,0.8), 0 0 20px rgba(250,204,21,0.4);
    animation:twinkle 2.4s ease-in-out infinite;
    transform:rotate(8deg);
  }
  @keyframes twinkle{
    0%,100%{opacity:0.7; transform:rotate(8deg) scale(1);}
    50%{opacity:1; transform:rotate(12deg) scale(1.15);}
  }
  /* Studio headline sparkle — twirls + scales, makes the page feel alive */
  .studio-sparkle{
    font-size:0.7em;
    vertical-align:0.18em;
    display:inline-block;
    animation:studio-twirl 3.4s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes studio-twirl{
    0%,100%{transform:rotate(-8deg) scale(1); opacity:0.85;}
    50%{transform:rotate(15deg) scale(1.2); opacity:1;}
  }
  /* Studio headline — soft amber underline on hover so it feels alive */
  .studio-headline{
    background-image:linear-gradient(to right, transparent 0%, transparent 100%);
    background-position:0 100%;
    background-repeat:no-repeat;
    background-size:0% 4px;
    transition:background-size 0.6s ease-out;
  }
  .studio-headline:hover{
    background-image:linear-gradient(to right, #FACC15, #FACC15);
    background-size:100% 4px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script defer src="./index.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
